<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>**title**| B2B Marketplace</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f4f6f8;
      color: #333;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #0b3d91;
      color: #fff;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .navbar ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }
    .navbar a:hover {
      text-decoration: underline;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 5rem 2rem;
      background: linear-gradient(to right, #0b3d91, #1c63d1);
      color: white;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    .btn {
      padding: 0.8rem 1.5rem;
      background-color: #ffd700;
      color: #0b3d91;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background-color: #ffc107;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .navbar ul {
        flex-direction: column;
        gap: 0.5rem;
        background: #0b3d91;
        position: absolute;
        right: 0;
        top: 60px;
        display: none;
      }
      .navbar.active ul {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">GlobalBidChain</div>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="form.html">Bid Submitting</a></li>
        <li><a href="#">Notifications</a></li>
        <li><a href="#">Buyer/Seller Central</a></li>
        <li><a href="#">Messages</a></li>
        <li><a href="#">Sign In</a></li>
        <li><a href="#">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <main class="hero">
    <h1>**category**/h1>
    <p>Buyers post, sellers bid. It's that simple.</p>
    <a href="form.html" class="btn">Post Your Product Request</a>
  </main>
</body>
</html>
